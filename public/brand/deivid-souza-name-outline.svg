<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9073 1049" role="img" aria-label="Deivid Souza">
  <style>
    .letter {
      fill: transparent;
      stroke: #e7ddcf;
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation:
        quantum-trace 1.15s cubic-bezier(.25,.46,.45,.94) var(--delay) forwards,
        quantum-fill .5s ease 1.82s forwards;
    }
    @keyframes quantum-trace { to { stroke-dashoffset: 0; } }
    @keyframes quantum-fill {
      to { fill: #e7ddcf; stroke: rgba(231,221,207,.28); }
    }
    @media (prefers-reduced-motion: reduce) {
      .letter { animation: none; fill: #e7ddcf; stroke-dashoffset: 0; }
    }
  </style>
